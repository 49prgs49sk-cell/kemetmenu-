html{background:#f1ede4}body{max-width:480px;margin:0 auto;background:var(--bg);box-shadow:0 0 50px rgba(60,40,10,.12)}

.hero::before{background:linear-gradient(180deg,rgba(7,9,13,.6),rgba(7,9,13,.05) 30%,rgba(253,251,247,.7) 72%,var(--bg))}
h1{font-size:clamp(30px,9vw,44px)}
.cta{grid-template-columns:repeat(3,1fr)!important;gap:8px!important}
.card{height:108px;font-size:15px;letter-spacing:.06em;background:#fff;color:#7a5314;border-color:#c9993a;backdrop-filter:none;box-shadow:0 6px 18px rgba(122,83,20,.12)}
.card.on,.card:active{background:linear-gradient(160deg,#e8c471,#c9993a);color:#2b1c05}
.chips{background:rgba(253,251,247,.95)}.chips a{color:#7a5314;border-color:#c9993a;background:#fff}
.it{background:#fff;border-color:rgba(201,153,58,.35)}
.sc img{height:min(56vh,380px);box-shadow:0 8px 24px rgba(60,40,10,.25)}.sc img:nth-child(even){height:min(50vh,340px)}
.copy{display:none}.hero{min-height:88svh;padding-left:16px;padding-right:16px}
.logos{position:static;width:100%;margin:0;height:auto;display:flex;flex-direction:row;align-items:center;justify-content:space-between}
.lk{width:45%}.lo{width:24%}
.by{display:flex;flex-direction:column;align-items:center;gap:7px;color:#ffe9a8;font:italic 400 24px/1 Georgia,'Times New Roman',serif;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.by::before,.by::after{content:"";width:1px;height:26px;background:linear-gradient(transparent,#e0aa3e,transparent)}
.hero{padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
.logos{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-content:normal}
.logos img{height:min(21vw,84px);width:auto}.lk{justify-self:end;width:auto}.lo{justify-self:start;width:auto}
.by{font:300 34px/1 Georgia,'Times New Roman',serif;font-style:normal;padding:0 18px}
.logos{display:flex;justify-content:center;align-items:center;gap:0;grid-template-columns:none}
.logos img{height:min(23vw,92px);width:auto}.lk,.lo{justify-self:auto}
.by{padding:0 11px;font-size:30px}
.logos .lk{height:min(20vw,84px)}.logos .lo{height:min(25vw,105px);margin-left:12px}
:root{--w:min(100vw,480px)}
.hero{min-height:min(100vw,460px);justify-content:center;padding:max(env(safe-area-inset-top,0px),20px) 12px 28px}
.bg{background-position:58% 46%}
.hero::before{background:linear-gradient(180deg,rgba(7,9,13,.55),rgba(7,9,13,.35) 55%,rgba(253,251,247,.55) 88%,var(--bg))}
.logos .lk{height:calc(var(--w)*.205)}.logos .lo{height:calc(var(--w)*.25);margin-left:8px}
.by{padding:0 9px;font-size:28px}
